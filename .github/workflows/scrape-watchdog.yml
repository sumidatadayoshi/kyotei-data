name: Scrape Watchdog

on:
  schedule:
    # 毎日 UTC 22:47 = 日本時間 翌7:47頃。
    # daily-scrape.yml の本来の発火時刻(UTC 18:37、JST 3:37頃)から
    # 4時間以上の余裕を見て、前日分の結果が正常に(status='ok'で)
    # 取得できているかを確認する。取得できていなければ自動で再取得を試み、
    # それでも失敗する場合はIssueを作成して人間に知らせる。
    - cron: "47 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: boatrace-daily-scrape
  cancel-in-progress: false

jobs:
  check-and-heal:
    runs-on: ubuntu-latest
    # リトライ時はdaily-scrape.ymlと同様に1日分をまるごと再取得するため、
    # 締切時オッズ追加後の所要時間(daily-scrape.yml参照)に合わせて延長している。
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check whether yesterday's scrape completed
        id: check
        run: python check_scrape_status.py >> "$GITHUB_OUTPUT"

      - name: Sync to latest main before retry
        id: sync
        if: steps.check.outputs.needs_retry == 'true'
        # concurrency groupで待機している間にdaily-scrape.ymlが
        # data/boatrace.dbを更新してpushしている可能性がある。ここで
        # 最新化しておかないと、古いベースの上でリトライ・コミットしてしまい、
        # push直前のrebaseでdata/boatrace.db(バイナリ)がコンフリクトして
        # ジョブごと失敗する(2026-08-29に実際発生)。
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Re-check after sync
        id: presync_check
        if: steps.check.outputs.needs_retry == 'true'
        env:
          TARGET_DATE: ${{ steps.check.outputs.date }}
        run: python check_scrape_status.py "$TARGET_DATE" >> "$GITHUB_OUTPUT"

      - name: Retry scrape for missing date
        id: retry
        if: steps.presync_check.outputs.needs_retry == 'true'
        # boatrace_scraper.pyは結果データが閾値未満(status=partial)だと
        # 終了コード1を返す。ここで失敗扱いにしてジョブを止めてしまうと、
        # 部分的に取れたデータのコミットや、失敗を伝えるIssue作成まで
        # スキップされてしまうため、続行させる。
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.check.outputs.date }}
        run: |
          python boatrace_scraper.py --date "$TARGET_DATE" --interval 1.5

      - name: Re-check status after retry
        id: recheck
        if: steps.check.outputs.needs_retry == 'true'
        env:
          TARGET_DATE: ${{ steps.check.outputs.date }}
        run: python check_scrape_status.py "$TARGET_DATE" >> "$GITHUB_OUTPUT"

      - name: Commit and push recovered data
        if: steps.check.outputs.needs_retry == 'true'
        env:
          TARGET_DATE: ${{ steps.check.outputs.date }}
          RECOVERED_STATUS: ${{ steps.recheck.outputs.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/boatrace.db
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: watchdog auto-recover $TARGET_DATE ($RECOVERED_STATUS)"
            git fetch origin main
            git rebase origin/main
            git push
          fi

      - name: Open issue if recovery did not fully succeed
        if: steps.check.outputs.needs_retry == 'true' && steps.recheck.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_DATE: ${{ steps.check.outputs.date }}
          RECOVERED_STATUS: ${{ steps.recheck.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "スケジュール実行の欠落を検知: ${TARGET_DATE} が未取得(自動リトライも失敗)" \
            --body "daily-scrape.yml の定期実行で ${TARGET_DATE} 分のデータが取得できていないことを検知し、scrape-watchdog.yml が自動リトライしましたが、status は \`${RECOVERED_STATUS}\` のままでした。手動での確認・再実行(workflow_dispatch)をお願いします。 [実行ログ](${RUN_URL})"

      - name: Note successful auto-recovery
        if: steps.check.outputs.needs_retry == 'true' && steps.recheck.outputs.status == 'ok'
        env:
          TARGET_DATE: ${{ steps.check.outputs.date }}
        run: |
          echo "Auto-recovered $TARGET_DATE: status=ok"
