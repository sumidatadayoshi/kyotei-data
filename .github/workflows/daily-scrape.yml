name: Daily Boatrace Scrape

on:
  schedule:
    # 毎日 UTC 18:37 = 日本時間(JST, UTC+9) 翌3:37頃。
    # 旧スケジュール(JST 23:30に「today」を取得)はGitHub Actionsの
    # スケジュール実行遅延でJST 0時をまたぐことがあり、その場合
    # 「まだ1レースも終わっていない翌日」の出走表だけを取得して
    # resultsが0件のまま終わってしまう不具合があった。
    # 前日のレースが確実に終わっている翌朝に「yesterday」を取得することで、
    # 日付境界のタイミング問題を構造的に回避する。
    # (ナイターを含む全場の最終レースは遅くとも21時台には終了するため、
    # 翌4:00時点でも前日のレース結果は確実に取得可能)
    #
    # 分をちょうど0にしていないのは意図的。GitHub Actionsの公式ドキュメントは
    # 「毎時0分ちょうどはスケジュール実行が集中し遅延・欠落しやすい」と明記しており、
    # 実際に2026年8月下旬、"0 19 * * *"のままだと数時間〜1日以上の遅延や、
    # トリガー自体が発生しない欠落が繰り返し発生した。ぴったり0分を避けることで
    # 混雑を避け、遅延・欠落の確率を下げる。
    # なお、これでも完全に防げるわけではないため、scrape-watchdog.ymlで
    # 「前日分が取得できているか」を別スケジュールで監視し、
    # 欠落時は自動リトライ + Issue通知する仕組みを併用している。
    - cron: "37 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: boatrace-daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 締切時オッズ(1レースあたり5ページ追加)の取得により所要時間が
    # 従来(約1時間)の3~4倍程度に伸びるため、余裕を持たせている。
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Git LFS
        run: git lfs install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update female racer list
        # entries.genderの判定に使う女性選手一覧を更新する。287名程度で
        # 数の変化も緩やかなため、日次ジョブの一部として毎回実行しても軽い。
        # 後続のentries保存(gender判定)が最新の一覧を使えるよう、最初に実行する。
        run: python boatrace_scraper.py --update-female-racers --interval 1.5

      - name: Run scraper (yesterday, JST基準)
        if: always()
        run: python boatrace_scraper.py --when yesterday --interval 1.5

      - name: Run scraper (today's racelist only, JST基準)
        # 出走表は前日17〜22時頃までに各場で公開されるため、JST 4:00の
        # 実行時点では当日分の出走表は既に取得可能。結果はまだ出ていない
        # ため取得しない(「今日のおすすめ」機能向け)。
        # 前段のステップが失敗していても、当日分の出走表取得は独立して試みる。
        if: always()
        run: python boatrace_scraper.py --when today --entries-only --interval 1.5

      - name: Commit and push data changes
        # concurrency groupで他ワークフローとの同時実行は避けているが、
        # ローカルからの直接pushなどとは依然競合しうる。fetch→rebase→pushを
        # 数回リトライし、それでも失敗したら後続ステップでIssueを作る。
        id: push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/boatrace.db
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "push_failed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update boatrace data ($(date -u +'%Y-%m-%d %H:%M UTC'))"

            max_attempts=5
            attempt=1
            push_failed=false
            while :; do
              git fetch origin main
              if git rebase origin/main && git push; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "push failed after $attempt attempts"
                push_failed=true
                break
              fi
              echo "push failed (attempt $attempt/$max_attempts), retrying..."
              attempt=$((attempt + 1))
              sleep $((attempt * 10))
            done
            echo "push_failed=$push_failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if push kept failing
        if: steps.push.outputs.push_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "日次スクレイプ: pushが繰り返し失敗しました" \
            --body "daily-scrape.yml でfetch→rebase→pushを複数回リトライしましたが、pushが成功しませんでした。取得済みデータはランナー上のコミットに残っていますが、リモートには反映されていません。手動での確認をお願いします。 [実行ログ](${RUN_URL})"
