name: Daily Boatrace Scrape

on:
  schedule:
    # 毎日 UTC 21:00 = 日本時間(JST, UTC+9) 翌6:00。
    # 旧スケジュール(JST 23:30に「today」を取得)はGitHub Actionsの
    # スケジュール実行遅延でJST 0時をまたぐことがあり、その場合
    # 「まだ1レースも終わっていない翌日」の出走表だけを取得して
    # resultsが0件のまま終わってしまう不具合があった。
    # 前日のレースが確実に終わっている翌朝に「yesterday」を取得することで、
    # 日付境界のタイミング問題を構造的に回避する。
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: boatrace-daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper (yesterday, JST基準)
        run: python boatrace_scraper.py --when yesterday --interval 1.5

      - name: Run scraper (today's racelist only, JST基準)
        # 出走表は前日17〜22時頃までに各場で公開されるため、JST 6:00の
        # 実行時点では当日分の出走表は既に取得可能。結果はまだ出ていない
        # ため取得しない(「今日のおすすめ」機能向け)。
        # 前段のステップが失敗していても、当日分の出走表取得は独立して試みる。
        if: always()
        run: python boatrace_scraper.py --when today --entries-only --interval 1.5

      - name: Commit and push data changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/boatrace.db
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update boatrace data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
